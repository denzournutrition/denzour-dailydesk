# Keeps the Google Sheet sync running when nobody has DailyDesk open.
# Calls the site's sync address every 5 minutes (GitHub may delay a run by a few minutes).
name: DailyDesk sheet sync
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Run due syncs
        run: curl -s -m 60 -o /dev/null -w "HTTP %{http_code}\n" "https://reporting.denzuu.com/index.php?p=gsynccron&key=7acebdbd9522aaeca33beb7c"
