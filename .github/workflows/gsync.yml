# Keeps the Google Sheet sync running when nobody has DailyDesk open.
# Needs one repository secret named GSYNC_URL: the full "Keep it live" address shown on the Google Sheets page in DailyDesk.
# Without that secret this job does nothing (the sync still runs whenever someone opens DailyDesk).
name: DailyDesk sheet sync
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Run due syncs
        env:
          GSYNC_URL: ${{ secrets.GSYNC_URL }}
        run: |
          if [ -z "$GSYNC_URL" ]; then echo "No GSYNC_URL secret set. Skipping."; exit 0; fi
          URL=$(printf '%s' "$GSYNC_URL" | tr -d '"' | tr -d "'" | tr -d '[:space:]')
          curl -s -m 60 -o /dev/null -w "HTTP %{http_code}\n" "$URL"
